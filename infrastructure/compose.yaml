name: sara-pragya

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sara_pragya
      POSTGRES_USER: sara_pragya
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - sara_pragya_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara_pragya -d sara_pragya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sara_pragya_objects:/data

volumes:
  sara_pragya_postgres:
  sara_pragya_objects:
